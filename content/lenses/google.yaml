id: google
company: Google
round_types:
  - "Product Design / Product Sense"
  - "Analytical / Estimation"
  - "Technical"
  - "Googleyness & Leadership"
philosophy: >-
  Google's loop leans harder on analytical and technical rounds than most product
  interviews, and historically expected PMs to hold a real technical conversation.
  Answers are expected to be structured and quantitative: a design idea that never
  reaches a number, or an estimate that never reaches an equation, reads as
  incomplete regardless of how creative it was.
rubric:
  - id: google.analytical
    name: Analytical Ability
    weight: 28
    description: "Decomposing ambiguous problems and reasoning quantitatively without data."
    strong_signal: "Builds an explicit equation or structure before estimating anything."
  - id: google.product-sense
    name: Product Sense
    weight: 26
    description: "Identifying real user needs and designing against them."
    strong_signal: "Names a specific user and traces every feature back to a stated need."
  - id: google.technical
    name: Technical Aptitude
    weight: 20
    description: "Holding a credible conversation about systems, constraints, and feasibility."
    strong_signal: "Names the boundary of their knowledge precisely instead of bluffing past it."
  - id: google.googleyness
    name: Googleyness & Leadership
    weight: 16
    description: "Comfort with ambiguity, intellectual humility, collaborative instinct."
    strong_signal: "Changes their position when given new information, and says why."
  - id: google.communication
    name: Structure & Communication
    weight: 10
    description: "Signposting a long answer so the interviewer can follow it."
    strong_signal: "States the plan before executing it and announces transitions."
red_flags:
  - "Refusing to estimate without data"
  - "Bluffing technical depth"
  - "Unstructured, associative answers to open-ended questions"
  - "Defending a first answer after being shown a problem with it"
