# WEIGHTS: how much each company's rubric rewards each CIRCLES stage.
# Researched estimates from published guidance, not insider information.

# ---------------------------------------------------------------- google
- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.comprehend }
  relation: WEIGHTS
  weight: 12
  rationale: >-
    Scoping is genuinely credited: clarifying an ambiguous prompt is treated as analytical work, not throat-clearing.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.identify }
  relation: WEIGHTS
  weight: 22
  rationale: >-
    Google expects a specific user before any design work, and probes segment choice hard in Product Sense rounds.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.report }
  relation: WEIGHTS
  weight: 20
  rationale: >-
    Needs must be stated concretely enough to be measured later; this lens pays for precision here.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.cut }
  relation: WEIGHTS
  weight: 12
  rationale: >-
    Prioritisation matters but is weighted below the analytical reasoning that justifies it.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.list }
  relation: WEIGHTS
  weight: 12
  rationale: >-
    Idea volume is not the signal; solutions are judged on whether they follow from the stated need.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.evaluate }
  relation: WEIGHTS
  weight: 16
  rationale: >-
    The analytical rounds live here — trade-offs are expected to reach numbers rather than adjectives.

- from: { type: company_lens, id: google }
  to: { type: framework_part, id: circles.summarize }
  relation: WEIGHTS
  weight: 6
  rationale: >-
    A crisp close is expected but carries little independent weight.

